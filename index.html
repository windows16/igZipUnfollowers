
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">App para detectar quién no te sigue en Instagram</h2>

<div class="py-6 px-2 max-w-2xl mx-auto">

  <div class="mb-6">
    <label id="lbl-zip" class="block cursor-pointer rounded-2xl border-2 border-dashed border-gray-300 bg-gray-50 hover:bg-gray-100 transition-colors p-10 text-center">
      <div class="flex flex-col items-center gap-2">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E1306C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="#E1306C" stroke="none"/>
        </svg>
        <p id="lbl-text" class="text-sm font-medium text-gray-700">Sube tu archivo de Instagram</p>
        <p class="text-xs text-gray-400">instagram-*.zip · Solo se procesa en tu navegador</p>
        <span class="mt-2 inline-block px-4 py-1.5 rounded-full text-xs font-medium bg-pink-100 text-pink-700 border border-pink-200">Seleccionar archivo</span>
      </div>
      <input type="file" id="file-zip" accept=".zip" class="hidden">
    </label>
  </div>

  <div id="error" class="hidden mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600"></div>

  <div id="stats" class="hidden grid grid-cols-3 gap-3 mb-6"></div>

  <div id="results-wrap" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <p class="text-sm font-medium text-gray-700">No te siguen de vuelta</p>
      <input type="text" id="search" placeholder="Buscar usuario..."
        class="text-sm rounded-lg border border-gray-200 bg-white px-3 py-1.5 w-44 focus:outline-none focus:ring-2 focus:ring-pink-300 placeholder-gray-300">
    </div>
    <div id="list" class="grid gap-2" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));"></div>
    <div id="empty" class="hidden text-center py-10 text-sm text-gray-400">No se encontraron resultados.</div>
  </div>

</div>

<script>
let unfollowers = [];

function extractFollowers(data) {
  const set = new Set();

  let list = [];

  if (Array.isArray(data)) {
    list = data;
  } else if (data.relationships_followers) {
    list = data.relationships_followers;
  }

  list.forEach(item => {
    (item.string_list_data || []).forEach(s => {
      if (s.value) {
        set.add(s.value.toLowerCase());
      }
    });
  });

  return set;
}

function extractFollowing(data) {
  const set = new Set();

  let list = [];

  if (Array.isArray(data)) {
    list = data;
  } else if (data.relationships_following) {
    list = data.relationships_following;
  }

  list.forEach(item => {
    if (item.title) {
      set.add(item.title.toLowerCase());
    }

    (item.string_list_data || []).forEach(s => {
      if (s.value) {
        set.add(s.value.toLowerCase());
      }
    });
  });

  return set;
}

const colors = [
  'bg-pink-100 text-pink-800',
  'bg-purple-100 text-purple-800',
  'bg-blue-100 text-blue-800',
  'bg-emerald-100 text-emerald-800',
  'bg-amber-100 text-amber-800'
];

function statCard(label, value, extra = '') {
  return `
    <div class="rounded-xl bg-white border border-gray-100 p-4 text-center ${extra}">
      <p class="text-xs text-gray-400 mb-1">${label}</p>
      <p class="text-2xl font-medium">${value}</p>
    </div>
  `;
}

function userCard(username) {
  const color =
    colors[username.charCodeAt(0) % colors.length];

  return `
    <a href="https://instagram.com/${username}"
       target="_blank"
       rel="noopener noreferrer"
       class="flex items-center gap-2 rounded-xl border border-gray-100 bg-white px-3 py-2 text-sm text-gray-700 hover:border-pink-300 hover:bg-pink-50 transition-colors no-underline overflow-hidden"
       title="@${username}">
       
      <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium ${color}">
        ${username[0].toUpperCase()}
      </span>

      <span class="truncate text-xs">
        ${username}
      </span>
    </a>
  `;
}

function render(list) {
  document.getElementById('list').innerHTML =
    list.map(userCard).join('');

  document
    .getElementById('empty')
    .classList.toggle('hidden', list.length > 0);
}

document
  .getElementById('search')
  .addEventListener('input', e => {
    const q = e.target.value.toLowerCase();

    if (!q) {
      render(unfollowers);
      return;
    }

    render(
      unfollowers.filter(user =>
        user.includes(q)
      )
    );
  });

document
  .getElementById('file-zip')
  .addEventListener('change', async e => {

    const file = e.target.files[0];
    if (!file) return;

    document
      .getElementById('error')
      .classList.add('hidden');

    document
      .getElementById('lbl-text')
      .textContent = file.name;

    try {

      const zip = await JSZip.loadAsync(file);

      const files = Object.keys(zip.files);

      // Buscar followers
      const followerFiles = files.filter(
        file =>
          file.includes('followers') &&
          file.endsWith('.json')
      );

      // Buscar following
      const followingFiles = files.filter(
        file =>
          file.includes('following') &&
          file.endsWith('.json')
      );

      if (
        followerFiles.length === 0 ||
        followingFiles.length === 0
      ) {
        throw new Error(
          'No se encontraron los archivos de seguidores y seguidos.'
        );
      }

      const followers = new Set();
      const following = new Set();

      // Leer followers
      for (const fileName of followerFiles) {

        const text =
          await zip.files[fileName].async('string');

        const partial =
          extractFollowers(JSON.parse(text));

        partial.forEach(user =>
          followers.add(user)
        );
      }

      // Leer following
      for (const fileName of followingFiles) {

        const text =
          await zip.files[fileName].async('string');

        const partial =
          extractFollowing(JSON.parse(text));

        partial.forEach(user =>
          following.add(user)
        );
      }

      unfollowers = [...following]
        .filter(user => !followers.has(user))
        .sort();

      console.log(
        'Followers:',
        followers.size
      );

      console.log(
        'Following:',
        following.size
      );

      console.log(
        'No siguen:',
        unfollowers.length
      );

      const statsEl =
        document.getElementById('stats');

      statsEl.classList.remove('hidden');

      statsEl.innerHTML =
        statCard(
          'Sigues a',
          following.size
        ) +
        statCard(
          'Te siguen',
          followers.size
        ) +
        statCard(
          'No te siguen',
          unfollowers.length,
          'text-red-500'
        );

      document
        .getElementById('results-wrap')
        .classList.remove('hidden');

      render(unfollowers);

      const upload =
        document.getElementById('lbl-zip');

      upload.classList.remove(
        'border-gray-300',
        'bg-gray-50'
      );

      upload.classList.add(
        'border-green-300',
        'bg-green-50'
      );

    } catch (err) {

      console.error(err);

      const el =
        document.getElementById('error');

      el.classList.remove('hidden');

      el.textContent =
        'Error al leer el ZIP: ' +
        err.message;
    }
  });
</script>
